services:
  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "1880:1880"
    volumes:
      - ./data:/data
    labels:
      - homepage.group=Casa
      - homepage.name=Node-RED
      - homepage.href=http://nodered.casa:1880
      - homepage.description=Automações visuais
      - homepage.icon=node-red.png
      - kuma.nodered.http.name=Node-RED
      - kuma.nodered.http.url=http://192.168.1.173:1880
