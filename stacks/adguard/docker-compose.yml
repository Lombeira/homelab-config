services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - 192.168.1.173:53:53/tcp
      - 192.168.1.173:53:53/udp
      - 192.168.1.173:3000:3000/tcp
      - 192.168.1.173:8081:80/tcp
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    labels:
      - homepage.group=Rede
      - homepage.name=AdGuard Home
      - homepage.href=http://192.168.1.173:8081
      - homepage.description=Bloqueio de anuncios e DNS
      - homepage.icon=adguard-home.png
      - kuma.adguard.http.name=AdGuard
      - kuma.adguard.http.url=http://192.168.1.173:8081/login.html
      - kuma.adguard.http.interval=60
      - homepage.widget.type=adguard
      - homepage.widget.url=http://192.168.1.173:8081
      - homepage.widget.username=glauco
      - homepage.widget.password=${AGH_PASSWORD}
networks: {}
